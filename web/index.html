<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreePower 控制台</title>
<link rel="stylesheet" href="/ui/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f6fed'/><path d='M9 22V10h13v3h-9v2.4h7.6v3H13V22z' fill='white'/></svg>">
<script>/*__FP_BOOT__*/</script>
</head>
<body>
  <div id="app" class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">FP</span>
        <span class="brand-text">
          <strong>FreePower</strong>
          <small id="brand-version">控制台</small>
        </span>
      </div>
      <nav id="nav" class="nav">
        <!-- 「常用」不可折叠：这几项是每天要点的，收起来只是多一次点击。
             分组与顺序对齐用户习惯的排法（常用在上、自动化在下）。 -->
        <div class="nav-group">
          <div class="nav-group-title">常用</div>
          <a class="nav-item" data-nav="profiles" href="#/profiles">环境管理</a>
          <a class="nav-item" data-nav="proxies" href="#/proxies">代理管理</a>
          <a class="nav-item" data-nav="apps" href="#/apps">应用中心</a>
        </div>
        <!-- 「自动化」可折叠（data-fold + 按钮式标题）。
             折叠状态存 localStorage，见 web/nav.js。 -->
        <div class="nav-group" data-fold="automation">
          <button class="nav-group-title foldable" type="button" data-fold-toggle="automation" aria-expanded="true">
            <span class="nav-caret" aria-hidden="true">▾</span><span>自动化</span>
          </button>
          <a class="nav-item" data-nav="agent" href="#/agent">AI Agent</a>
          <a class="nav-item" data-nav="sync" href="#/sync">窗口同步</a>
          <a class="nav-item" data-nav="api" href="#/api">API &amp; MCP</a>
        </div>
      </nav>
      <div class="sidebar-foot">
        <div id="foot-port" class="muted small">—</div>
        <div id="foot-running" class="muted small">—</div>
        <!-- 侧栏底部账号菜单（0.4.3 ④）：设置 / 外观 / 网络诊断。
             形态照逆向 28-号文的侧栏底部（对手那六项里，邀请奖励/语言/退出登录我们没有账号体系，
             见设置页「没做 / 在别处」那节）。菜单由 app.js 画，这里只留挂载点。 -->
        <div id="account-menu" class="account-menu"></div>
      </div>
    </aside>
    <main class="main">
      <header id="page-head" class="page-head"></header>
      <section id="page" class="page"></section>
    </main>
  </div>
  <div id="toasts" class="toasts"></div>
  <div id="dialog-root"></div>
  <script type="module" src="/ui/app.js"></script>
</body>
</html>
